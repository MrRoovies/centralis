<!-- E-MAILS -->
<section class="ci-section">
    <h4 class="ci-section__title">
        <span class="ci-section__icon">✉️</span>
        E-mails
        <button class="ci-btn-add"
                onclick="SystemModal.open('/clientes/email/{{ cliente.id }}/create')">
            + Adicionar
        </button>
    </h4>
    {% if cliente.emails.all %}
    <form id="form_del_email">
        {% csrf_token %}
        <div class="ci-contact-list">
            {% for email in cliente.emails.all %}
            <div class="ci-contact-item">
                <div class="ci-contact-item__info">
                    <span class="ci-contact-item__value">{{ email.email }}</span>
                    <span class="ci-contact-item__badge">{{ email.get_tipo_display }}</span>
                </div>
                <button class="action-btn btn-small btn-delete"
                        data-type="email"
                        data-action="delete"
                        data-cliente="{{ email.id }}">
                    Excluir
                </button>
            </div>
            {% endfor %}
        </div>
    </form>
    {% else %}
    <p class="ci-empty-hint">Nenhum e-mail cadastrado.</p>
    {% endif %}
</section>
