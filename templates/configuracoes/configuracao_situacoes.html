
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.page { padding: 1.5rem 0; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.page-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.page-subtitle { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
.btn { cursor: pointer; border-radius: var(--border-radius-md); font-size: 13px; font-weight: 500; padding: 7px 14px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); transition: background 0.15s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--color-background-secondary); }
.btn-primary { background: var(--color-text-primary); color: var(--color-background-primary); border-color: transparent; }
.btn-primary:hover { opacity: 0.85; background: var(--color-text-primary); }
.btn-danger { color: var(--color-text-danger); border-color: var(--color-border-danger); }
.btn-danger:hover { background: var(--color-background-danger); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); }
.search-row { display: flex; gap: 10px; margin-bottom: 1rem; align-items: center; }
.search-row input { flex: 1; font-size: 13px; padding: 7px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); }
.search-row select { font-size: 13px; padding: 7px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); min-width: 150px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 16px; text-align: left; border-bottom: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); }
tbody tr { border-bottom: 0.5px solid var(--color-border-tertiary); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--color-background-secondary); }
tbody td { padding: 11px 16px; color: var(--color-text-primary); vertical-align: middle; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; }
.badge-ativa { background: #EAF3DE; color: #3B6D11; }
.badge-inativa { background: #F1EFE8; color: #5F5E5A; }
.badge-carteira { background: #E6F1FB; color: #185FA5; font-size: 11px; padding: 2px 7px; border-radius: 20px; }
.actions { display: flex; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot-verde { background: #639922; }
.dot-cinza { background: #888780; }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--color-text-secondary); font-size: 13px; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-secondary); width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 0.5px solid var(--color-border-tertiary); }
.modal-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
.modal-body { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.modal-footer { padding: 1rem 1.5rem; border-top: 0.5px solid var(--color-border-tertiary); display: flex; justify-content: flex-end; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); }
.field input, .field select, .field textarea { font-size: 13px; padding: 8px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); width: 100%; }
.field textarea { resize: vertical; min-height: 64px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.section-label { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 6px; }
.carteiras-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 8px; }
.carteira-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); }
.carteira-item-label { font-size: 12px; color: var(--color-text-primary); display: flex; align-items: center; gap: 6px; }
.carteira-item label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-primary); cursor: pointer; }
.carteira-item input[type=checkbox] { cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
.stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
.stat-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
.stat-label { font-size: 12px; color: var(--color-text-secondary); margin-top: 1px; }
.close-btn { cursor: pointer; background: none; border: none; font-size: 18px; color: var(--color-text-secondary); line-height: 1; padding: 2px; }
.close-btn:hover { color: var(--color-text-primary); }
.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--color-text-primary); color: var(--color-background-primary); font-size: 13px; padding: 10px 16px; border-radius: var(--border-radius-md); z-index: 200; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
.tag-color { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.no-modal { display: none; }
</style>

<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Situações</div>
      <div class="page-subtitle">Gerencie as situações vinculadas às carteiras</div>
    </div>
    <button class="btn btn-primary" onclick="abrirModal()">+ Nova situação</button>
  </div>

  <div class="stats" id="stats-cards"></div>

  <div class="card">
    <div style="padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary);">
      <div class="search-row">
        <input type="text" placeholder="Buscar por nome..." id="busca" oninput="renderTabela()" />
        <select id="filtro-status" onchange="renderTabela()">
          <option value="">Todos os status</option>
          <option value="ativa">Ativa</option>
          <option value="inativa">Inativa</option>
        </select>
        <select id="filtro-carteira" onchange="renderTabela()">
          <option value="">Todas as carteiras</option>
        </select>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Situação</th>
          <th>Descrição</th>
          <th>Carteiras vinculadas</th>
          <th>Status</th>
          <th>Criado em</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-body"></tbody>
    </table>
  </div>
</div>

<div class="overlay no-modal" id="modal-overlay" onclick="fecharModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modal-titulo">Nova situação</span>
      <button class="close-btn" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>Nome da situação</label>
          <input type="text" id="f-nome" placeholder="Ex: Inadimplente" />
        </div>
        <div class="field">
          <label>Cor de identificação</label>
          <input type="color" id="f-cor" value="#1D9E75" style="height:36px; padding:2px 4px; cursor:pointer;" />
        </div>
      </div>
      <div class="field">
        <label>Descrição</label>
        <textarea id="f-desc" placeholder="Descreva quando esta situação deve ser aplicada..."></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option value="ativa">Ativa</option>
            <option value="inativa">Inativa</option>
          </select>
        </div>
        <div class="field">
          <label>Ordem de exibição</label>
          <input type="number" id="f-ordem" placeholder="1" min="1" />
        </div>
      </div>
      <div class="field">
        <div class="section-label">Carteiras vinculadas <span style="color:var(--color-text-secondary);font-weight:400">(CarteiraSituacao)</span></div>
        <div class="carteiras-list" id="carteiras-checkboxes"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Salvar situação</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const carteiras = [
  { id: 1, nome: "Carteira Padrão" },
  { id: 2, nome: "Carteira Premium" },
  { id: 3, nome: "Carteira Corporativa" },
  { id: 4, nome: "Carteira Varejo" },
  { id: 5, nome: "Carteira Digital" },
];

let situacoes = [
  { id: 1, nome: "Regular", desc: "Cliente sem pendências, em dia com seus compromissos.", cor: "#1D9E75", status: "ativa", ordem: 1, carteiras: [1, 2, 3], criadoEm: "12/01/2024" },
  { id: 2, nome: "Inadimplente", desc: "Cliente com pagamentos em atraso superior a 30 dias.", cor: "#D85A30", status: "ativa", ordem: 2, carteiras: [1, 3], criadoEm: "12/01/2024" },
  { id: 3, nome: "Negociação", desc: "Cliente em processo de renegociação de dívida.", cor: "#BA7517", status: "ativa", ordem: 3, carteiras: [1, 2, 4], criadoEm: "15/02/2024" },
  { id: 4, nome: "Encerrado", desc: "Contrato encerrado pelo cliente ou pela instituição.", cor: "#888780", status: "inativa", ordem: 4, carteiras: [1, 2, 3, 4, 5], criadoEm: "20/03/2024" },
  { id: 5, nome: "Análise de Crédito", desc: "Aguardando resultado de análise cadastral.", cor: "#378ADD", status: "ativa", ordem: 5, carteiras: [2, 5], criadoEm: "05/04/2024" },
];

let editandoId = null;
let nextId = 6;

function nomesCarteiras(ids) {
  return ids.map(id => {
    const c = carteiras.find(c => c.id === id);
    return c ? c.nome : "";
  }).filter(Boolean);
}

function renderStats() {
  const total = situacoes.length;
  const ativas = situacoes.filter(s => s.status === "ativa").length;
  const vinculos = situacoes.reduce((acc, s) => acc + s.carteiras.length, 0);
  document.getElementById("stats-cards").innerHTML = `
    <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Total de situações</div></div>
    <div class="stat-card"><div class="stat-value">${ativas}</div><div class="stat-label">Ativas</div></div>
    <div class="stat-card"><div class="stat-value">${vinculos}</div><div class="stat-label">Vínculos com carteiras</div></div>
  `;
}

function renderFiltroCarteira() {
  const sel = document.getElementById("filtro-carteira");
  carteiras.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.nome;
    sel.appendChild(opt);
  });
}

function renderTabela() {
  const busca = document.getElementById("busca").value.toLowerCase();
  const fStatus = document.getElementById("filtro-status").value;
  const fCarteira = document.getElementById("filtro-carteira").value;

  let lista = situacoes.filter(s => {
    const matchNome = s.nome.toLowerCase().includes(busca) || s.desc.toLowerCase().includes(busca);
    const matchStatus = !fStatus || s.status === fStatus;
    const matchCarteira = !fCarteira || s.carteiras.includes(parseInt(fCarteira));
    return matchNome && matchStatus && matchCarteira;
  });

  lista.sort((a, b) => a.ordem - b.ordem);

  const tbody = document.getElementById("tabela-body");
  if (lista.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">Nenhuma situação encontrada.</div></td></tr>`;
    return;
  }

  tbody.innerHTML = lista.map(s => {
    const nomes = nomesCarteiras(s.carteiras);
    const badgesHtml = nomes.slice(0, 2).map(n => `<span class="badge-carteira">${n}</span>`).join(" ");
    const extra = nomes.length > 2 ? `<span class="badge-carteira">+${nomes.length - 2}</span>` : "";
    return `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="tag-color" style="background:${s.cor}"></span>
            <span style="font-weight:500">${s.nome}</span>
          </div>
        </td>
        <td style="color:var(--color-text-secondary);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.desc}</td>
        <td><div style="display:flex;flex-wrap:wrap;gap:4px">${badgesHtml}${extra}</div></td>
        <td>
          <span class="badge badge-${s.status}">
            <span class="dot dot-${s.status === 'ativa' ? 'verde' : 'cinza'}"></span>
            ${s.status === 'ativa' ? 'Ativa' : 'Inativa'}
          </span>
        </td>
        <td style="color:var(--color-text-secondary)">${s.criadoEm}</td>
        <td>
          <div class="actions">
            <button class="btn btn-sm" onclick="abrirModal(${s.id})">Editar</button>
            <button class="btn btn-sm btn-danger" onclick="excluir(${s.id})">Excluir</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");
}

function renderCheckboxesCarteiras(selecionadas = []) {
  const container = document.getElementById("carteiras-checkboxes");
  container.innerHTML = carteiras.map(c => `
    <div class="carteira-item">
      <label>
        <input type="checkbox" value="${c.id}" ${selecionadas.includes(c.id) ? "checked" : ""} />
        ${c.nome}
      </label>
    </div>
  `).join("");
}

function abrirModal(id = null) {
  editandoId = id;
  const overlay = document.getElementById("modal-overlay");
  overlay.classList.remove("no-modal");
  overlay.style.display = "flex";

  if (id) {
    const s = situacoes.find(s => s.id === id);
    document.getElementById("modal-titulo").textContent = "Editar situação";
    document.getElementById("f-nome").value = s.nome;
    document.getElementById("f-cor").value = s.cor;
    document.getElementById("f-desc").value = s.desc;
    document.getElementById("f-status").value = s.status;
    document.getElementById("f-ordem").value = s.ordem;
    renderCheckboxesCarteiras(s.carteiras);
  } else {
    document.getElementById("modal-titulo").textContent = "Nova situação";
    document.getElementById("f-nome").value = "";
    document.getElementById("f-cor").value = "#1D9E75";
    document.getElementById("f-desc").value = "";
    document.getElementById("f-status").value = "ativa";
    document.getElementById("f-ordem").value = situacoes.length + 1;
    renderCheckboxesCarteiras([]);
  }
}

function fecharModal(event) {
  if (event && event.target !== document.getElementById("modal-overlay")) return;
  const overlay = document.getElementById("modal-overlay");
  overlay.style.display = "none";
  overlay.classList.add("no-modal");
  editandoId = null;
}

function getSelecionadas() {
  const checks = document.querySelectorAll("#carteiras-checkboxes input[type=checkbox]:checked");
  return Array.from(checks).map(c => parseInt(c.value));
}

function salvar() {
  const nome = document.getElementById("f-nome").value.trim();
  if (!nome) { showToast("Informe o nome da situação."); return; }

  const dados = {
    nome,
    cor: document.getElementById("f-cor").value,
    desc: document.getElementById("f-desc").value.trim(),
    status: document.getElementById("f-status").value,
    ordem: parseInt(document.getElementById("f-ordem").value) || 1,
    carteiras: getSelecionadas(),
  };

  if (editandoId) {
    const idx = situacoes.findIndex(s => s.id === editandoId);
    situacoes[idx] = { ...situacoes[idx], ...dados };
    showToast("Situação atualizada com sucesso.");
  } else {
    const hoje = new Date();
    const criadoEm = `${String(hoje.getDate()).padStart(2,'0')}/${String(hoje.getMonth()+1).padStart(2,'0')}/${hoje.getFullYear()}`;
    situacoes.push({ id: nextId++, criadoEm, ...dados });
    showToast("Situação criada com sucesso.");
  }

  fecharModal();
  renderTabela();
  renderStats();
}

function excluir(id) {
  situacoes = situacoes.filter(s => s.id !== id);
  renderTabela();
  renderStats();
  showToast("Situação excluída.");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

renderFiltroCarteira();
renderStats();
renderTabela();
</script>
