{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prático Sistemas — Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy:    #04375F;
            --teal:    #007AAA;
            --teal2:   #127B89;
            --light:   #f0f6fa;
            --border:  #d6e4ee;
            --text:    #1a2e3b;
            --muted:   #7a9aae;
            --error:   #c0392b;
            --error-bg:#fdf2f2;
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--navy);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ══ LADO ESQUERDO ═══════════════════════════════════ */
        .lg-left {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 48px;
            overflow: hidden;
        }

        /* Grade de pontos */
        .lg-left::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,.10) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* Bolha de luz superior */
        .lg-glow {
            position: absolute;
            width: 560px; height: 560px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,122,170,.40) 0%, transparent 68%);
            top: -140px; right: -140px;
            pointer-events: none;
            animation: pulse 7s ease-in-out infinite;
        }

        /* Bolha inferior */
        .lg-glow2 {
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(18,123,137,.30) 0%, transparent 70%);
            bottom: -60px; left: -60px;
            pointer-events: none;
            animation: pulse 9s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1);    opacity: 1;  }
            50%       { transform: scale(1.08); opacity: .7; }
        }

        /* Logo */
        .lg-logo {
            position: relative;
            z-index: 1;
            max-width: 340px;
            width: 100%;
            /* Fundo preto do PNG — invertemos e limpamos visualmente
               usando mix-blend-mode para o fundo navy aparecer */
            filter: brightness(0) invert(1);
            /* O logo tem fundo preto e ícone azul/teal + texto branco após o filtro.
               Aplicamos drop-shadow para dar presença visual */
            /*filter:
                drop-shadow(0 4px 32px rgba(0,122,170,.5))
                drop-shadow(0 2px 8px rgba(0,0,0,.4));
            */
            animation: logoIn .7s cubic-bezier(.22,1,.36,1) both .1s;
        }

        @keyframes logoIn {
            from { transform: translateY(16px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* Rodapé esquerda */
        .lg-footer {
            position: absolute;
            bottom: 28px;
            font-size: 11px;
            color: rgba(255,255,255,.22);
            font-family: 'JetBrains Mono', monospace;
            z-index: 1;
            letter-spacing: .3px;
        }

        /* ══ LADO DIREITO — formulário ═══════════════════════ */
        .lg-right {
            width: 440px;
            flex-shrink: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 48px;
            position: relative;
            animation: slideIn .5s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes slideIn {
            from { transform: translateX(40px); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        .lg-right::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--navy), var(--teal), var(--teal2));
        }

        /* ── Cabeçalho do form ── */
        .lg-form-header { margin-bottom: 36px; }

        .lg-form-eyebrow {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--teal);
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .lg-form-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .lg-form-sub {
            font-size: 13px;
            color: var(--muted);
            font-weight: 400;
        }

        /* ── Erro ── */
        .lg-error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--error-bg);
            border: 1px solid #f5c6c6;
            border-left: 3px solid var(--error);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--error);
            font-weight: 600;
            animation: shake .35s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-6px); }
            40%      { transform: translateX(6px); }
            60%      { transform: translateX(-4px); }
            80%      { transform: translateX(4px); }
        }

        /* ── Campos ── */
        .lg-field { margin-bottom: 20px; }

        .lg-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: .6px;
            margin-bottom: 8px;
        }

        .lg-input-wrap { position: relative; }

        .lg-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            transition: color .2s;
        }

        .lg-input-wrap:focus-within .lg-input-icon { color: var(--teal); }

        .lg-input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            font-size: 14px;
            font-family: 'Sora', sans-serif;
            color: var(--text);
            background: var(--light);
            transition: all .2s;
            outline: none;
        }

        .lg-input:focus {
            border-color: var(--teal);
            background: white;
            box-shadow: 0 0 0 3px rgba(0,122,170,.1);
        }

        .lg-toggle-pw {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            cursor: pointer; color: var(--muted);
            padding: 2px; transition: color .2s;
            display: flex; align-items: center;
        }
        .lg-toggle-pw:hover { color: var(--teal); }

        /* ── Botão ── */
        .lg-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--navy) 0%, var(--teal) 100%);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            transition: transform .2s, box-shadow .2s;
            letter-spacing: .3px;
        }

        .lg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(4,55,95,.3);
        }

        .lg-btn:active { transform: translateY(0); }

        .lg-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
            transform: translateX(-100%);
            transition: transform .4s;
        }
        .lg-btn:hover::after { transform: translateX(100%); }

        /* ── Rodapé form ── */
        .lg-form-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ══ RESPONSIVE ══════════════════════════════════════ */
        @media (max-width: 820px) {
            body { flex-direction: column; }

            .lg-left {
                flex: none;
                padding: 48px 32px;
                min-height: 240px;
            }

            .lg-logo { max-width: 240px; }
            .lg-footer { display: none; }

            .lg-right {
                width: 100%;
                flex: 1;
                padding: 40px 32px;
                border-radius: 24px 24px 0 0;
                margin-top: -24px;
            }
        }

        @media (max-width: 400px) {
            .lg-right { padding: 32px 24px; }
        }
    </style>
</head>
<body>

    <!-- ═══ ESQUERDA ═════════════════════════════════════════ -->
    <div class="lg-left">
        <div class="lg-glow"></div>
        <div class="lg-glow2"></div>

        <img
            class="lg-logo"
            src="{% static 'img/logoin.png' %}"
            alt="Prático Sistemas"
        >

        <div class="lg-footer">© 2025 Prático Sistemas</div>
    </div>

    <!-- ═══ DIREITA ══════════════════════════════════════════ -->
    <div class="lg-right">

        <div class="lg-form-header">
            <p class="lg-form-eyebrow">Bem-vindo de volta</p>
            <h2 class="lg-form-title">Entrar na conta</h2>
            <p class="lg-form-sub">Informe suas credenciais para continuar.</p>
        </div>

        {% if error %}
        <div class="lg-error">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
                <path d="M8 5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="login">
            {% csrf_token %}

            <div class="lg-field">
                <label class="lg-label" for="username">Usuário</label>
                <div class="lg-input-wrap">
                    <svg class="lg-input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="5.5" r="3" stroke="currentColor" stroke-width="1.4"/>
                        <path d="M2 14c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                    <input class="lg-input" type="text" id="username" name="username"
                           placeholder="seu.usuario" autocomplete="username" required>
                </div>
            </div>

            <div class="lg-field">
                <label class="lg-label" for="password">Senha</label>
                <div class="lg-input-wrap">
                    <svg class="lg-input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                        <path d="M5 7V5a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                    <input class="lg-input" type="password" id="password" name="password"
                           placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="lg-toggle-pw" onclick="toggleSenha()" title="Mostrar/ocultar senha">
                        <svg id="lg-eye-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4"/>
                            <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="lg-btn">Entrar</button>
        </form>

        <div class="lg-form-footer">Prático Sistemas · Acesso seguro</div>
    </div>

    <script>
        function toggleSenha() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('lg-eye-icon');
            const show  = input.type === 'password';
            input.type  = show ? 'text' : 'password';
            icon.innerHTML = show
                ? `<path d="M2 2l12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                   <path d="M6.5 6.6A3 3 0 0111.4 11M4.2 4.3C2.6 5.5 1 8 1 8s2.5 5 7 5c1.4 0 2.7-.4 3.8-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                   <path d="M8 5a3 3 0 013 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>`
                : `<path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4"/>
                   <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>`;
        }

        document.getElementById('username').focus();
    </script>

</body>
</html>
